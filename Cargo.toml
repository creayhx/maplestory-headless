[package]
name = "openstory-bot"
version = "0.1.0"
edition = "2021"
description = "Protocol-driven MapleStory 079 headless bot — auto-hunt, auto-gather, skill system, terminal console & Web editor"
license = "MIT"
keywords = ["maplestory", "bot", "protocol", "headless", "automation"]
categories = ["command-line-utilities"]

[workspace]
members = ["crates/console", "crates/console-lib", "crates/webui", "crates/resource"]
resolver = "2"

[features]
default = []

[dependencies]
encoding_rs = "0.8.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "io-std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
