[package]
name = "openstory-webui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
tiny_http = "0.11"
serde_json = "1"
# The standalone binary validates saved config against the bot's real
# RuntimeConfig schema (same validation as the bot's own `reload`).
openstory-bot = { path = "../.." }

[[bin]]
name = "openstory-web"
path = "src/main.rs"
