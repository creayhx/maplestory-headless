[package]
name = "openstory-console-lib"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "控制台前端的共享层 (本地终端控制台与将来的服务器版前端复用): 文本/配色/中文渲染/日志缓冲/命令规格/补全/快照"

[dependencies]
openstory-bot = { path = "../.." }
ratatui = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-width = "0.2"
regex = "1"
